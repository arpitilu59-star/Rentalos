name: CI
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json is out of sync with package.json (npm ci refuses), so use install.
      - run: npm install --no-audit --no-fund
      # mobile-i18n imports files from mobile/, whose tsconfig needs the Expo packages (not installed here).
      - run: npx vitest run --exclude src/lib/_tests_/mobile-i18n.test.ts
      - run: npm run build
