name: WhatsApp dispatch
on:
  schedule:
    - cron: "*/10 * * * *" # runs only from the default branch; GitHub may delay it
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: whatsapp-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Call dispatcher
        env:
          SECRET: ${{ secrets.WHATSAPP_DISPATCH_SECRET }}
          # Canonical production host is www.rentalos.in (the apex answers 308 -> www).
          # Override with a repository *variable* if the primary domain ever changes.
          DISPATCH_URL: ${{ vars.WHATSAPP_DISPATCH_URL || 'https://www.rentalos.in/api/whatsapp/dispatch' }}
          ALLOWED_HOSTS: "www.rentalos.in rentalos.in"
        run: bash .github/scripts/whatsapp-dispatch.sh
